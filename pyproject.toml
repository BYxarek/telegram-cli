[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-cli-local"
description = "Telegram CLI for a personal account"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version", "dependencies"]
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "BYxarek"}]
keywords = ["telegram", "cli", "telethon", "agent-skills"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Chat",
]

[project.scripts]
tcli = "tg:main"

[project.urls]
Repository = "https://github.com/BYxarek/telegram-cli"
Issues = "https://github.com/BYxarek/telegram-cli/issues"

[tool.setuptools]
py-modules = ["tg"]
packages = ["tcli_skills"]

[tool.setuptools.package-data]
tcli_skills = ["SKILL.md"]

[tool.setuptools.dynamic]
version = {attr = "tcli_skills.__version__"}
dependencies = {file = ["requirements.txt"]}
