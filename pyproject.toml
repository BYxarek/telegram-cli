[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-cli-local"
version = "0.1.0"
description = "Telegram CLI for a personal account"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
tcli = "tg:main"

[project.urls]
Repository = "https://github.com/BYxarek/telegram-cli"
Issues = "https://github.com/BYxarek/telegram-cli/issues"

[tool.setuptools]
py-modules = ["tg"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
